<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends — Scream Collector</title>
<style>.friend-sections{display:grid;gap:18px}.friend-list{display:grid;gap:9px}.friend-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);background:#111}.friend-copy{min-width:0;flex:1}.friend-actions{display:flex;gap:7px;flex-wrap:wrap}.friend-actions button,.friend-actions a{min-height:40px;padding:8px 11px}.friend-search{display:flex;gap:8px}.friend-search input{flex:1}.danger-link{color:var(--danger)!important}@media(max-width:650px){.friend-row{align-items:flex-start;flex-wrap:wrap}.friend-actions{width:100%}.friend-actions>*{flex:1}.friend-search{flex-direction:column}}</style><link rel="stylesheet" href="/styles.css"></head>
<body><app-menu></app-menu><script type="module" src="/src/menu-bootstrap.js"></script><main class="wrap"><a href="index.html">← Home</a><h1>Friends</h1><p class="muted">Manage the people who can reach friends-only parts of your profile.</p>
<section class="card"><h2>Find collectors</h2><form id="friendSearch" class="friend-search"><label class="sr-only" for="friendQuery">Username</label><input id="friendQuery" type="search" placeholder="Search by username" autocomplete="off" required><button class="btn" type="submit">Search</button></form><div id="searchStatus" class="muted" role="status" aria-live="polite"></div><div id="searchResults" class="friend-list"></div></section>
<div class="friend-sections"><section class="card"><h2>Requests</h2><div id="requestStatus" class="muted" role="status" aria-live="polite">Loading requests…</div><div id="requests" class="friend-list"></div></section><section class="card"><h2>Your friends</h2><div id="friendStatus" class="muted" role="status" aria-live="polite">Loading friends…</div><div id="friends" class="friend-list"></div></section></div></main><script type="module" src="/src/pages/friends.js"></script></body></html>
