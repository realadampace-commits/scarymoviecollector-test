<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Messages</title>
<link rel="stylesheet" href="/styles.css">
<style>
  :root { --messenger-blue:#0084ff; --panel:#fff; --line:#e5e7eb; --muted:#65676b; --canvas:#f0f2f5; --ink:#050505; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input,textarea { font:inherit; }
  .messages-shell { max-width:1280px; height:calc(100vh - 74px); min-height:620px; margin:18px auto; display:grid; grid-template-columns:360px minmax(0,1fr); overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 34px rgba(0,0,0,.10); }
  .inbox { min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line); background:#fff; }
  .inbox-head { padding:20px 16px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:26px; letter-spacing:-.6px; margin:0; }
  .new-chat { width:36px; height:36px; border:0; border-radius:50%; background:#e7f3ff; color:#006fe6; cursor:pointer; font-size:20px; line-height:1; }
  .new-chat:hover { background:#d8edff; }
  .start-chat { display:flex; gap:8px; padding:0 16px 12px; }
  .start-chat input { min-width:0; flex:1; border:0; border-radius:999px; background:#f0f2f5; padding:10px 13px; outline:2px solid transparent; }
  .start-chat input:focus { outline-color:#b8dcff; background:#fff; }
  .start-chat button,.send { border:0; border-radius:999px; background:var(--messenger-blue); color:#fff; padding:9px 14px; font-weight:700; cursor:pointer; }
  .start-chat button:disabled,.send:disabled { opacity:.5; cursor:not-allowed; }
  .start-msg { min-height:18px; padding:0 20px 8px; color:var(--muted); font-size:13px; }
  .thread-list { overflow:auto; padding:2px 8px 12px; }
  .thread { width:100%; border:0; display:flex; gap:12px; align-items:center; text-align:left; padding:10px 8px; border-radius:10px; background:transparent; color:inherit; cursor:pointer; }
  .thread:hover,.thread.active { background:#e7f3ff; }
  .avatar { width:48px; height:48px; flex:0 0 auto; position:relative; display:grid; place-items:center; border-radius:50%; overflow:hidden; background:linear-gradient(135deg,#c8d7e9,#7e9dc2); color:#fff; font-size:18px; font-weight:800; }
  .avatar-media,.avatar-frame { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .avatar-frame { object-fit:contain; pointer-events:none; }
  .thread-copy { min-width:0; flex:1; }
  .thread-name { display:flex; justify-content:space-between; gap:8px; align-items:baseline; font-weight:700; }
  .thread-time { color:var(--muted); font-size:12px; font-weight:500; }
  .thread-preview { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--muted); font-size:13px; margin-top:3px; }
  .empty-inbox { padding:22px 14px; color:var(--muted); text-align:center; font-size:14px; }
  .conversation { min-width:0; display:flex; flex-direction:column; background:#fff; }
  .conversation-head { min-height:68px; display:flex; align-items:center; gap:12px; padding:0 22px; border-bottom:1px solid var(--line); }
  .conversation-head h2 { margin:0; font-size:16px; }
  .presence { color:var(--muted); font-size:12px; margin-top:2px; }
  .back { display:none; border:0; background:none; color:var(--messenger-blue); padding:6px; font-size:22px; cursor:pointer; }
  .message-list { flex:1; overflow:auto; display:flex; flex-direction:column; gap:4px; padding:22px; background:linear-gradient(#fff,#f9fafb); }
  .welcome { margin:auto; max-width:370px; text-align:center; color:var(--muted); }
  .welcome .avatar { margin:0 auto 13px; width:64px; height:64px; font-size:24px; }
  .welcome h2 { color:var(--ink); margin:0 0 6px; font-size:22px; }
  .retry-messages { margin-top:10px; border:0; border-radius:999px; background:var(--messenger-blue); color:#fff; padding:9px 14px; font-weight:700; cursor:pointer; }
  .retry-messages:hover { background:#0073e6; }
  .message-row { display:flex; align-items:flex-end; gap:8px; max-width:78%; }
  .message-row.mine { margin-left:auto; flex-direction:row-reverse; }
  .message-row .avatar { width:28px; height:28px; font-size:11px; }
  .bubble { padding:9px 12px; border-radius:18px; background:#e4e6eb; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.35; }
  .mine .bubble { background:var(--messenger-blue); color:#fff; }
  .message-meta { display:block; color:var(--muted); font-size:11px; margin:3px 8px; }
  .composer { display:flex; gap:9px; align-items:flex-end; padding:14px 18px; border-top:1px solid var(--line); }
  .composer-help { color:var(--muted); font-size:11px; margin:0 0 4px 8px; }
  .composer textarea { min-height:22px; max-height:120px; flex:1; resize:vertical; border:0; border-radius:20px; background:#f0f2f5; padding:10px 13px; outline:2px solid transparent; }
  .composer textarea:focus { outline-color:#b8dcff; background:#fff; }
  .send { min-width:60px; }
  .composer-status { position:absolute; transform:translateY(-36px); color:var(--muted); font-size:12px; }
  @media (max-width:760px) { body { background:#fff; } .messages-shell { height:100vh; min-height:0; margin:0; border:0; border-radius:0; display:block; } .inbox,.conversation { height:100%; } .conversation { display:none; } .messages-shell.show-thread .inbox { display:none; } .messages-shell.show-thread .conversation { display:flex; } .back { display:block; } .message-list { padding:18px 14px; } }
</style>
</head>
<body>
<app-menu></app-menu>
<script type="module" src="/src/menu-bootstrap.js"></script>
<main class="messages-shell" id="messagesShell">
  <aside class="inbox" aria-label="Conversations">
    <header class="inbox-head"><h1>Chats</h1><button class="new-chat" id="focusStart" type="button" aria-label="Start a new chat">✎</button></header>
    <form class="start-chat" id="startForm"><label for="userSearch">Username</label><input id="userSearch" autocomplete="off" placeholder="Message @username"/><button id="startBtn" type="submit">Send</button></form>
    <div id="startMsg" class="start-msg" aria-live="polite"></div>
    <div id="list" class="thread-list"></div>
    <div id="status" class="empty-inbox" aria-live="polite"></div>
  </aside>
  <section class="conversation" aria-label="Current conversation">
    <header class="conversation-head"><button class="back" id="backToInbox" type="button" aria-label="Back to chats">‹</button><div class="avatar" id="headAvatar">?</div><div><h2 id="head">Choose a conversation</h2><div class="presence" id="subhead">Select a chat or start a new one.</div></div></header>
    <div id="preview" class="message-list" aria-live="polite"><div class="welcome"><div class="avatar">✦</div><h2>Your messages</h2><p>Choose a conversation on the left to read and reply.</p></div></div>
    <form class="composer" id="composer"><span id="composeStatus" class="composer-status" aria-live="polite"></span><div style="min-width:0; flex:1"><textarea id="text" rows="1" placeholder="Write a message" disabled aria-label="Message" aria-describedby="composerHelp"></textarea><p class="composer-help" id="composerHelp">Choose a conversation to enable messaging. Enter to send · Shift+Enter for a new line</p></div><button id="send" class="send" type="submit" disabled>Send</button></form>
  </section>
</main>
<script type="module" src="/src/pages/messages.js"></script>
</body>
</html>
