<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>New Post — Scream Collector</title>
<style>
  :root{--bg:#111;--panel:#1b1b1b;--ink:#eee;--muted:#a9adb4;--accent:#2a6}
  body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif}
  a{color:#9ecbff;text-decoration:none}
  .wrap{max-width:800px;margin:0 auto;padding:24px}
  .card{background:#1b1b1b;border-radius:12px;padding:16px;margin-top:16px}
  .muted{color:#a9adb4}.ok{color:#9f9}.err{color:#f88}
  input,textarea,button{padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#eee}
  input,textarea{width:100%}
  button{border:none;background:var(--accent);cursor:pointer}
</style>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<app-menu></app-menu>
<script type="module" src="/src/menu-bootstrap.js"></script>

<div class="wrap">
  <a id="back" href="forum.html">← Forum</a>
  <h2>New Post</h2>

  <div class="card">
    <label for="title">Title</label>
    <input id="title" name="title" required autocomplete="off" aria-describedby="postHelp" placeholder="Thread title"/>
    <label for="body" style="margin-top:10px">Body</label>
    <textarea id="body" name="body" rows="8" required aria-describedby="postHelp" placeholder="Write your post…"></textarea>
    <p id="postHelp" class="muted">Both fields are required. Your post will be visible to the community.</p>
    <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
      <button id="save" type="button" disabled aria-disabled="true">Create</button>
      <span id="msg" class="muted" role="status" aria-live="polite"></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
 window.SUPABASE_URL || '',
 window.SUPABASE_ANON_KEY || ''
);
const qs = new URLSearchParams(location.search);
const catId = qs.get('cat');
document.getElementById('back').href = 'forum_category.html?id=' + catId;

const titleEl = document.getElementById('title');
const bodyEl  = document.getElementById('body');
const saveBtn = document.getElementById('save');
const msgEl   = document.getElementById('msg');
const msg=(t,cls='muted')=>{msgEl.className=cls; msgEl.textContent=t;};

let me=null, myRole='free';

(async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    msg('Please sign in to create a post. Redirecting to sign in…','err');
    location.href='login.html?next='+encodeURIComponent(location.pathname+location.search);
    return;
  }
  me = session.user;
  const { data:p } = await sb.from('profiles').select('role').eq('id',me.id).maybeSingle();
  myRole = p?.role || 'free';
  if (myRole==='free'){
    msg('Free members cannot create posts. Return to the category to keep browsing.','err');
    return;
  }
  saveBtn.disabled = false;
  saveBtn.removeAttribute('aria-disabled');
})();

saveBtn.addEventListener('click', async ()=>{
  const title = titleEl.value.trim();
  const body  = bodyEl.value.trim();
  if(!title || !body) return msg('Title and body required.','err');

  msg('Creating…');
  saveBtn.disabled = true;
  saveBtn.setAttribute('aria-busy', 'true');
  const { data: ins, error } = await sb.from('forum_posts').insert({
    title, body, category_id: catId, author_id: me.id   // <-- include author_id
  }).select('id').single();

  if (error) {
    saveBtn.disabled = false;
    saveBtn.removeAttribute('aria-busy');
    msg('Error: '+error.message+' Try again.','err');
    return;
  }
  location.href = 'forum_post.html?id=' + ins.id;
});
</script>
</body>
</html>
