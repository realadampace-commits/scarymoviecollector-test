<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title>
<style>.notification-head{display:flex;align-items:end;justify-content:space-between;gap:16px}.notification-list{display:grid;gap:8px;margin-top:18px}.notification{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);background:#111}.notification.unread{border-left:4px solid var(--accent);background:#171112}.notification-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#272122;font-size:20px}.notification-copy{color:inherit;text-decoration:none;min-width:0}.notification-copy strong,.notification-copy span{display:block}.notification-copy span{margin-top:3px;color:var(--muted);font-size:14px}.notification-copy time{display:block;margin-top:5px;color:var(--muted);font-size:12px}.notification-actions{display:flex;gap:6px}.notification-actions button{min-height:38px;padding:7px 10px}.empty{text-align:center;padding:42px 18px}@media(max-width:620px){.notification-head{align-items:start;flex-direction:column}.notification{grid-template-columns:auto minmax(0,1fr)}.notification-actions{grid-column:2}.notification-actions button{flex:1}}</style><link rel="stylesheet" href="/styles.css"></head>
<body><app-menu></app-menu><script type="module" src="/src/menu-bootstrap.js"></script><main class="wrap"><a href="index.html">← Home</a><header class="notification-head"><div><h1>Notifications</h1><p class="muted">Messages, friends, forum activity, and collectible updates.</p></div><button id="markAll" class="btn" type="button">Mark all read</button></header><div id="status" class="muted" role="status" aria-live="polite">Loading notifications…</div><section id="notifications" class="notification-list" aria-label="Notifications" aria-busy="true"></section></main><script type="module" src="/src/pages/notifications.js"></script></body></html>
