<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Search Users</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px}
  a{color:#9ecbff;text-decoration:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1c1c1c;border-radius:10px;padding:12px 14px;margin:8px 0}
  .muted{opacity:.75}
  input{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#222;color:#eee}
  button{padding:10px 14px;background:#444;border:none;border-radius:6px;color:#fff;cursor:pointer}
  .roleTag{margin-left:6px;padding:2px 8px;border-radius:999px;font-size:12px}
  .role-free{background:#333;color:#ddd}
  .role-subscriber{background:#2a6;color:#fff}
  .role-moderator{background:#c33;color:#fff}
  .role-owner{background:gold;color:#111;font-weight:700}
</style>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<app-menu></app-menu>
<script type="module" src="/src/menu-bootstrap.js"></script>
<div class="wrap">
  <a href="index.html">← Home</a>
  <h1>Search Users</h1>

  <form id="searchForm" style="display:flex; gap:8px; margin:8px 0 16px">
    <label for="q">Username</label>
    <input id="q" name="q" type="search" autocomplete="username" placeholder="Type a username (e.g., nate008)" />
    <button id="searchSubmit" type="submit">Search</button>
  </form>

  <div id="userStatus" class="muted" role="status" aria-live="polite" aria-atomic="true">Loading members…</div>
  <div id="results" aria-label="Member directory"></div>
</div>

<script type="module" src="/src/pages/users.js"></script>
</body>
</html>
