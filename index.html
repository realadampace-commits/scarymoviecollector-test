<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Browse and manage your collection of scary movie memorabilia.">
<title>Scream Collector — Home</title>
<style>
  :root{--bg:#111;--panel:#1b1b1b;--ink:#eee;--muted:#a9adb4;--accent:#dc143c}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  a{color:#9ecbff;text-decoration:none}
  .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .btn{background:#444;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none}
  .card{background:var(--panel);border-radius:12px;padding:16px;margin-top:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tile{display:block;color:inherit;text-decoration:none;background:#161616;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden}
  .thumb{height:160px;background:#222;display:flex;align-items:center;justify-content:center}
  .thumb img{max-width:100%;max-height:100%}
  .meta{padding:10px}
  .muted{color:var(--muted)}
  .skip-link{position:absolute;left:8px;top:-48px;z-index:10;background:#fff;color:#111;padding:10px 12px;border-radius:6px;font-weight:700}
  .skip-link:focus{top:8px}
  body.auth-pending .auth-action{visibility:hidden}
</style>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-pending">
<a class="skip-link" href="#main-content">Skip to collection</a>
<app-menu></app-menu>
<script type="module" src="/src/menu-bootstrap.js"></script>

<header class="brand-hero">
  <img src="/images/scary-movie-collectors-logo.webp" alt="Scary Movie Collectors Logo" width="560" height="560"
       >
  <div class="brand-copy"><p class="eyebrow">Private collection · public archive</p><p>Catalog the objects that made horror history.</p></div>
</header>

<main id="main-content" class="wrap" tabindex="-1">
  <div class="top">
    <h1 style="margin:0">Recent Items</h1>
    <a id="addItemAction" class="btn auth-action" href="login.html?next=create.html">Log in to add an item</a>
    <a class="btn" href="users.html">Users</a>
    <a id="settingsAction" class="btn auth-action" href="login.html?next=settings.html">Log in for settings</a>
  </div>

  <div class="card">
    <div id="msg" class="muted" role="status" aria-live="polite" aria-atomic="true">Loading…</div>
    <div id="list" class="grid"></div>
  </div>
</main>

<script type="module" src="/src/pages/home.js"></script>
</body>
</html>
