<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Post — Scream Collector</title>
<style>
  :root{--bg:#f0f2f5;--panel:#fff;--ink:#050505;--muted:#65676b;--accent:#1877f2;--line:#e4e6eb}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
  a{color:#1877f2;text-decoration:none}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px}
  .card{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.08);border-radius:12px;padding:16px;margin-top:14px}
  .muted{color:var(--muted)} .ok{color:#237a3b}.err{color:#c5221f}
  .btn{background:#e4e6eb;color:#050505;border:none;border-radius:7px;padding:10px 16px;cursor:pointer;text-decoration:none;font-weight:700}.btn.primary{background:var(--accent);color:#fff}
  .header{display:flex;align-items:center;gap:10px}.ava{--avatar-size:44px}.title{font-size:20px;margin:0 0 3px}.meta{font-size:13px;color:var(--muted)}.body{white-space:pre-wrap;margin-top:14px;font-size:16px;line-height:1.45;color:#242526}.replyBox{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}textarea{box-sizing:border-box;width:100%;min-height:90px;padding:12px;border-radius:9px;border:1px solid var(--line);background:#f0f2f5;color:#050505}.reply{display:flex;gap:10px;border:0;background:#f0f2f5;border-radius:14px;padding:12px}.reply-ava{--avatar-size:32px;font-weight:700;color:#65676b}.reply .metaRow{display:flex;align-items:center;gap:8px}.reply .rbody{white-space:pre-wrap;margin-top:6px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .post-stats{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);margin-top:16px;padding:10px 2px;color:var(--muted);font-size:13px}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:5px}.post-actions.can-delete{grid-template-columns:repeat(4,1fr)}.btn-action{border:0;background:transparent;border-radius:7px;color:var(--muted);font:inherit;font-size:14px;font-weight:700;padding:10px;cursor:pointer}.btn-action:hover,.btn-action.liked{background:#e7f3ff;color:var(--accent)}.danger-action{color:#ef6679!important}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<app-menu></app-menu>
<script type="module" src="/src/menu-bootstrap.js"></script>

<div class="wrap">
  <a href="forum.html">← Forum</a>

  <!-- Post -->
  <div id="postCard" class="card">
    <div class="header">
      <span id="pAvatar" class="profile-avatar ava" aria-hidden="true"><span class="profile-avatar-fallback">?</span></span>
      <div>
        <h2 id="pTitle" class="title">Loading…</h2>
        <div class="meta" id="pMeta">@user • <span id="pWhen">…</span></div>
      </div>
    </div>
    <div id="pBody" class="body muted" style="margin-top:8px">…</div>
    <div id="postActions"></div>
  </div>

  <!-- Reply composer (any signed-in user can reply) -->
  <div id="replyCompose" class="card" style="display:none">
    <div class="row">
      <h3 style="margin:0">Reply</h3>
      <span id="rcMsg" class="muted"></span>
    </div>
    <div class="replyBox" style="margin-top:10px">
      <label for="rcText" class="sr-only">Reply to this post</label>
      <textarea id="rcText" placeholder="Write your reply…" aria-describedby="rcHint" required minlength="1"></textarea>
      <button id="rcSend" class="btn primary" type="button">Post Reply</button>
    </div>
    <div id="rcHint" class="muted">Share a helpful response with the community.</div>
  </div>

  <!-- Replies -->
  <div class="card">
    <h3 style="margin:0 0 8px">Comments</h3>
    <div id="rStatus" class="muted" role="status" aria-live="polite" aria-atomic="true">Loading…</div>
    <div id="rList" style="display:grid;gap:10px;margin-top:8px"></div>
  </div>
</div>

<script type="module" src="/src/pages/forum-post.js"></script>
</body>
</html>
