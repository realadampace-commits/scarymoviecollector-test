<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Forum Category — Scream Collector</title><link rel="stylesheet" href="/styles.css"><style>
:root{--blue:#1877f2;--canvas:#f0f2f5;--card:#fff;--ink:#050505;--muted:#65676b;--line:#e4e6eb}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:680px;margin:18px auto}.back{color:var(--blue);font-weight:650;font-size:14px}.category-head,.post,.subcats,.empty{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.category-head{padding:0;min-height:190px;overflow:hidden;background:linear-gradient(135deg,#20243b,#6a3048)}.banner-overlay{min-height:190px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.78)),var(--banner,linear-gradient(135deg,#20243b,#6a3048));background-size:cover;background-position:center;color:#fff}.category-head h1{font-size:29px;margin:0 0 5px}.category-head p{margin:0;color:rgba(255,255,255,.82);font-size:14px}.subcats{padding:13px;margin-bottom:14px}.subcats h2{font-size:16px;margin:0 0 9px}.subcat-row{display:flex;gap:9px;align-items:center;padding:9px;border-radius:8px;font-weight:650}.subcat-row:hover{background:#f0f2f5}.badge,.avatar{display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:800}.badge{width:30px;height:30px;background:#e7f3ff;color:var(--blue)}.feed-head{display:flex;align-items:center;justify-content:space-between;padding:4px 3px 10px;font-weight:750}.new-post{background:var(--blue);color:#fff;border-radius:8px;padding:8px 11px;font-size:13px}.post{padding:15px;margin-bottom:13px}.post-top{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;background:linear-gradient(135deg,#99badf,#6688b5)}.author{font-weight:750}.when{color:var(--muted);font-size:13px}.post h2{font-size:18px;margin:13px 0 7px}.post-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;color:#242526;margin:0}.post-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:9px;color:var(--muted);font-size:14px;font-weight:650}.post-content{display:block;color:inherit}.post-more{margin-left:auto;color:var(--muted);font-size:18px;letter-spacing:2px;padding:4px 8px}.post-stats{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);margin-top:15px;padding:9px 2px;color:var(--muted);font-size:13px}.post-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:5px}.post-actions a{text-align:center;border-radius:6px;color:var(--muted);font-size:14px;font-weight:650;padding:8px}.post-actions a:hover{background:#f0f2f5;color:var(--blue)}.empty{padding:28px 16px;text-align:center;color:var(--muted)}@media(max-width:720px){.wrap{margin:0;padding:12px}.category-head,.post,.subcats{border-radius:10px}}
</style></head><body><app-menu></app-menu><script type="module" src="/src/menu-bootstrap.js"></script><main class="wrap"><a class="back" href="forum.html">← All categories</a><header id="categoryBanner" class="category-head"><div class="banner-overlay"><h1 id="catTitle">Loading…</h1><p id="catDescription">Posts stay organized in this category.</p></div></header><section id="childrenCard" class="subcats" style="display:none"><h2>Choose a subcategory</h2><nav id="childrenList" aria-label="Subcategories"></nav></section><section id="postsCard"><div class="feed-head"><span>Posts</span><span id="postActions"></span></div><div id="postsStatus" class="empty" role="status" aria-live="polite">Loading posts…</div><div id="postsList"></div></section></main><script type="module" src="/src/pages/forum-category.js"></script></body></html>
